services:
  # Backend API Service
  - type: web
    name: fraud-detection-api
    env: python
    region: oregon
    plan: free
    buildCommand: pip install -r api/requirements.txt
    startCommand: cd api && gunicorn app:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.9.18
      - key: FLASK_ENV
        value: production
      - key: PYTHONPATH
        value: .
        
  # Frontend Service
  - type: web
    name: fraud-detection-frontend
    env: node
    region: oregon
    plan: free
    buildCommand: cd fraud-dashboard && npm install && npm run build
    startCommand: cd fraud-dashboard && npm run serve
    envVars:
      - key: NODE_VERSION
        value: 18
      - key: NODE_ENV
        value: production