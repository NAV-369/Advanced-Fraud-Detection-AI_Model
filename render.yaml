services:
  # Backend API Service
  - type: web
    name: fraud-detection-api
    env: python
    buildCommand: |
      python -m pip install --upgrade pip
      python -m pip install setuptools wheel
      cd api && pip install -r requirements.txt
    startCommand: cd api && gunicorn app:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.9.18
      - key: FLASK_ENV
        value: production
      - key: PYTHONPATH
        value: ./api

  # Frontend Service (as web instead of static-site)
  - type: web
    name: fraud-detection-frontend
    env: node
    buildCommand: cd fraud-dashboard && npm install && npm run build
    startCommand: cd fraud-dashboard && npx serve -s dist
    envVars:
      - key: NODE_VERSION
        value: 18
      - key: NODE_ENV
        value: production